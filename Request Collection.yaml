      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.PrivateApiGatewayHost }}/authorization"
    name: Private - OAuth - Get authorization code
    meta:
      id: req_a1cf94e5542443b5a933b3c07307c5dd
      created: 1772200551888
      modified: 1772553200568
      isPrivate: false
      description: Gets the authorization code which can be used with the public API
        to request an access token for VC retrieval.
      sortKey: -1772198007662
    method: GET
    parameters:
      - name: redirect_uri
        value: "{{ _.RedirectUri }}"
        description: ""
        disabled: false
      - name: client_id
        value: "{{ _.ClientId }}"
        description: ""
        disabled: false
      - name: response_type
        value: code
        description: ""
        disabled: false
      - name: state
        value: someState
        description: ""
        disabled: false
      - name: scope
        value: openid
        description: ""
        disabled: false
    headers:
      - name: User-Agent
        value: insomnia/12.3.1
        description: ""
        disabled: false
      - name: session-id
        value: "{{ _.SessionId }}"
        description: ""
        disabled: false
    scripts:
      afterResponse: >
        const jsonBody = insomnia.response.json();


        insomnia.environment.set("AuthorizationCode",
        jsonBody.authorizationCode.value);


        insomnia.test("success", () => {
        	insomnia.expect(insomnia.response.code).to.eql(200);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.PublicApiGatewayHost }}/token"
    name: Public - OAuth - Get access token
    meta:
      id: req_369c372a011f4609a34484cc23bc0320
      created: 1772208461152
      modified: 1772553202730
      isPrivate: false
      description: Generates an access token that can be used to get a VC.
      sortKey: -1772198007612
    method: POST
    body:
      mimeType: application/x-www-form-urlencoded
      params:
        - name: client_assertion_type
          value: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
          description: ""
          disabled: false
        - name: grant_type
          value: authorization_code
          description: ""
          disabled: false
        - name: code
          value: "{{ _.AuthorizationCode }}"
          description: ""
          disabled: false
        - name: redirect_uri
          value: "{{ _.RedirectUri }}"
          description: ""
          disabled: false
        - name: client_assertion
          value: "{% jwtCreate 'ES256', _.ClientId, _.ClientId, _.TokenAudience, 0, 300,
            'UUIDv4', '{}', _.TokenEndpointSigningKeyInPemFormat.key,
            _.TokenEndpointJwtHeader, '' %}"
          description: ""
          disabled: false
    headers:
      - name: Content-Type
        value: application/x-www-form-urlencoded
      - name: User-Agent
        value: insomnia/12.3.1
        description: ""
        disabled: false
      - name: x-api-key
        value: "{{ _.TestResourcesApiKey }}"
        description: ""
        disabled: false
    scripts:
      afterResponse: |
        const jsonBody = insomnia.response.json();

        insomnia.environment.set("AccessToken", jsonBody.access_token);

        insomnia.test("success", () => {
        	insomnia.expect(insomnia.response.code).to.eql(200);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.PublicApiGatewayHost }}/credential/issue"
    name: Public - CRI - Get VC
    meta:
      id: req_d1a54b55c6f3403f9e96435789ad68c0
      created: 1772212100522
      modified: 1772553207025
      isPrivate: false
      description: Calls the CRI-specific function that validates whether the journey
        was successful and returns a VC.
      sortKey: -1772198007587
    method: POST
    headers:
      - name: User-Agent
        value: insomnia/12.3.1
        description: ""
        disabled: false
      - name: x-api-key
        value: "{{ _.TestResourcesApiKey }}"
        description: ""
        disabled: false
    authentication:
      type: bearer
      disabled: false
      token: "{{ _.AccessToken }}"
      prefix: ""
    scripts:
      afterResponse: |
        insomnia.test("success", () => {
        	insomnia.expect(insomnia.response.code).to.eql(200);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
