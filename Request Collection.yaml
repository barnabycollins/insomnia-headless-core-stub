  description: ""
collection:
  - url: "{{ _.TestResourcesHost }}/start"
    name: Core stub - Start
    meta:
      id: req_9b0de40c35094b61ab511398e9eec094
      created: 1772198007962
      modified: 1772553185272
      isPrivate: false
      description: Creates a JWT representing the client's intent to create a session
        in the CRI.
      sortKey: -1772198007962
    method: POST
    body:
      mimeType: application/json
      text: "{}"
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.3.1
        description: ""
        disabled: false
    authentication:
      type: iam
      disabled: false
      accessKeyId: "{% aws_sso _.AwsProfile, 'accessKeyId' %}"
      secretAccessKey: "{% aws_sso _.AwsProfile, 'secretAccessKey' %}"
      sessionToken: "{% aws_sso _.AwsProfile, 'sessionToken' %}"
      region: "{{ _.AwsRegion }}"
      service: execute-api
    scripts:
      afterResponse: |-
        const jsonBody = insomnia.response.json();

        insomnia.environment.set("SessionToken", jsonBody.request);
        insomnia.environment.set("ClientId", jsonBody.client_id);

        insomnia.test("success", () => {
        	insomnia.expect(insomnia.response.code).to.eql(200);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.PrivateApiGatewayHost }}/session"
    name: Private - OAuth - Create session
    meta:
      id: req_7f145f77d4e74dfeaf4071c5535631a4
      created: 1772198993848
      modified: 1772553191783
      isPrivate: false
      description: Initiates the user journey in the CRI by creating session and
        person identity entries in DynamoDB.
      sortKey: -1772198007862
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
        	"request": "{{ _.SessionToken }}",
        	"client_id": "{{ _.ClientId }}"
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.3.1
        description: ""
        disabled: false
    scripts:
      afterResponse: |
        const jsonBody = insomnia.response.json();

        insomnia.environment.set("SessionId", jsonBody.session_id);
        insomnia.environment.set("RedirectUri", jsonBody.redirect_uri);
        insomnia.environment.set("State", jsonBody.state);

        insomnia.test("success", () => {
        	insomnia.expect(insomnia.response.code).to.eql(201);
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
